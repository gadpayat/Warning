<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinking Warning Sign</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.warning-sign{
    width:500px;
    animation:alarmFlash 0.5s infinite;
}

@keyframes alarmFlash{
    0%{
        opacity:1;
        filter:brightness(1.8) drop-shadow(0 0 40px red);
    }
    50%{
        opacity:0.3;
        filter:brightness(0.5);
    }
    100%{
        opacity:1;
        filter:brightness(1.8) drop-shadow(0 0 40px red);
    }
}
</style>
</head>
<body>

<img src="warning-sign.png" alt="Warning Sign" class="warning-sign">

</body>
</html>
