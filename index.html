<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warning Sign</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#111;
        font-family:Arial, sans-serif;
    }

    .warning-box{
        padding:40px 60px;
        border:5px solid #ff0000;
        border-radius:15px;
        background:#ff0000;
        color:white;
        font-size:3rem;
        font-weight:bold;
        text-align:center;
        animation:blink 1s infinite;
        box-shadow:0 0 20px #ff0000;
    }

    @keyframes blink{
        0%, 50%{
            opacity:1;
            box-shadow:0 0 30px #ff0000;
        }
        51%, 100%{
            opacity:0.2;
            box-shadow:none;
        }
    }

    .icon{
        display:block;
        font-size:4rem;
        margin-bottom:10px;
    }
</style>
</head>
<body>

<div class="warning-box">
    <span class="icon">⚠️</span>
    WARNING
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinking Warning Sign</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.warning-sign{
    width:500px;
    animation:alarmFlash 0.5s infinite;
}

@keyframes alarmFlash{
    0%{
        opacity:1;
        filter:brightness(1.8) drop-shadow(0 0 40px red);
    }
    50%{
        opacity:0.3;
        filter:brightness(0.5);
    }
    100%{
        opacity:1;
        filter:brightness(1.8) drop-shadow(0 0 40px red);
    }
}
</style>
</head>
<body>

<img src="warning-sign.png" alt="Warning Sign" class="warning-sign">

</body>
</html>
